name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows deploying by hand from the Actions tab.
  workflow_dispatch:

# Required for the Pages deployment to authenticate.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Tests gate the deploy: a broken interpreter must never ship.
      - run: pnpm test

      - name: Build
        env:
          # Project pages live at /<repo>/; this yields e.g. "/tobot/".
          BASE_PATH: /${{ github.event.repository.name }}/
          # Vite inlines these at build time, so they have to be present here
          # rather than at runtime. All three are public by design: they end up
          # in the shipped bundle, and access control lives in the database's
          # row-level security policies. Left unset, the site falls back to
          # localStorage and simply shows no account screen.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Not a secret, just a switch: set it as a repository *variable*.
          VITE_SUPABASE_GOOGLE: ${{ vars.VITE_SUPABASE_GOOGLE }}
        run: pnpm build

      # Reads the Pages configuration set under Settings > Pages, which has to
      # be switched to "GitHub Actions" once before the first deploy.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
