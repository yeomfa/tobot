name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows deploying by hand from the Actions tab.
  workflow_dispatch:

# `pages: write` and `id-token: write` authenticate the deployment;
# `administration: write` is what lets the enablement step below switch Pages
# on for the repository the first time.
permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Tests gate the deploy: a broken interpreter must never ship.
      - run: pnpm test

      - name: Build
        env:
          # Project pages live at /<repo>/; this yields e.g. "/tobot/".
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm build

      # `enablement` turns Pages on for the repository the first time this
      # runs, instead of failing with "Get Pages site failed" until someone
      # switches it on by hand in Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
