<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#e8873a" />
    <title>Tobot | Aprende a programar</title>
    <meta
      name="description"
      content="Arma algoritmos con bloques y velos al instante en español, en pseudocódigo, en código real y como diagrama de flujo. Gratis y sin instalar nada."
    />

    <!--
      Without these a link shared into WhatsApp or Classroom previews as a bare
      URL, which is exactly how this reaches a class. The image is the real
      editor, so the preview makes the same argument the page does.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tobot" />
    <meta
      property="og:title"
      content="Tobot — Aprende a programar sin pelear con la sintaxis"
    />
    <meta
      property="og:description"
      content="Arma algoritmos con bloques y velos al instante en español, en pseudocódigo, en código real y como diagrama de flujo."
    />
    <meta property="og:image" content="./og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Applies the saved theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('tobot.preferences.v1') || '{}');
          if (stored.theme === 'dark' || stored.theme === 'light') {
            document.documentElement.setAttribute('data-theme', stored.theme);
          }
          if (stored.language) document.documentElement.lang = stored.language;
        } catch (error) {
          /* Storage may be unavailable; the default theme is fine. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
