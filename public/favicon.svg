<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The same mark the app draws from src/components/BrandMark.tsx: a robot whose
    head is a statement block snapping into the next one. Kept in step with that
    component by hand.

    No background tile, so it sits on whatever the browser puts behind it: on a
    dark tab strip the navy head gets a light rim and the antenna stalk turns
    light, or both would sink into it.
  -->
  <style>
    .rim { stroke: transparent; }
    .stalk { stroke: #171d2e; }
    @media (prefers-color-scheme: dark) {
      .rim { stroke: #e8ebf3; }
      .stalk { stroke: #e8ebf3; }
    }
  </style>
  <path class="stalk" d="M16 3.8V6.6" fill="none" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="16" cy="3" r="2.3" fill="#e8873a"/>
  <path class="rim" d="M7.2 6.6H24.8Q28 6.6 28 9.8V16.2Q28 19.4 24.8 19.4H14.2l-1.3 1.7H10.3l-1.3-1.7H7.2Q4 19.4 4 16.2V9.8Q4 6.6 7.2 6.6Z" fill="#171d2e" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="11.2" y="9.6" width="2.8" height="6.6" rx="1.4" fill="#22d3ee"/>
  <rect x="18" y="9.6" width="2.8" height="6.6" rx="1.4" fill="#22d3ee"/>
  <path d="M6.6 22H9l1.3 1.7H12.9l1.3-1.7H25.4Q28 22 28 24.6V26.8Q28 29.4 25.4 29.4H6.6Q4 29.4 4 26.8V24.6Q4 22 6.6 22Z" fill="#0891b2"/>
</svg>
