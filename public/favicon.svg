  <g fill="none" stroke="#e8873a" stroke-width="2" stroke-linecap="round">
    <rect x="5.5" y="10.5" width="21" height="16" rx="5.5"/>
    <line x1="16" y1="6" x2="16" y2="10.5"/>
  </g>

  <circle cx="16" cy="5" r="2.2" fill="#e8873a"/>
  <circle cx="12" cy="18.5" r="2.4" fill="#e8873a"/>
  <circle cx="20" cy="18.5" r="2.4" fill="#e8873a"/>
