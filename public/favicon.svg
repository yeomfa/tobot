<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The same mark the app draws from src/components/BrandMark.tsx: a robot
    whose body is the statements of an algorithm. Kept in step with that
    component by hand — the geometry below is its 32-unit grid, shifted down
    and scaled slightly to sit inside the rounded tile with even margins.
  -->
  <rect width="32" height="32" rx="7" fill="#171d2e"/>

  <g transform="translate(1.6 2.4) scale(0.9)">
    <path d="M16 2.5v3.5" fill="none" stroke="#e8873a" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="16" cy="2.6" r="2" fill="#e8873a"/>

    <rect x="5" y="6" width="22" height="13" rx="5" fill="none" stroke="#e8873a" stroke-width="2.2"/>
    <circle cx="11.6" cy="12.5" r="2" fill="#e8873a"/>
    <circle cx="20.4" cy="12.5" r="2" fill="#e8873a"/>

    <rect x="5" y="21.4" width="22" height="3.1" rx="1.55" fill="#6366f1"/>
    <rect x="8.6" y="26" width="18.4" height="3.1" rx="1.55" fill="#0ea5e9" opacity="0.85"/>
  </g>
</svg>
