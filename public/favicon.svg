<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    The product mark: Tobot's head, drawn to stay legible at 16px. The visor
    is one solid shape rather than two separate eyes, because separate eyes
    close up into noise at favicon sizes.
  -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfdff"/>
      <stop offset="100%" stop-color="#e6e9f4"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#171d2e"/>

  <!-- Antenna -->
  <line x1="32" y1="14" x2="32" y2="20" stroke="#e8873a" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="32" cy="11" r="3.6" fill="#e8873a"/>

  <!-- Head -->
  <rect x="14" y="20" width="36" height="28" rx="9" fill="url(#shell)"/>

  <!-- Visor with two eyes cut into it -->
  <rect x="19" y="25" width="26" height="15" rx="6" fill="#0e1320"/>
  <circle cx="26" cy="32.5" r="3.1" fill="#7dd3fc"/>
  <circle cx="38" cy="32.5" r="3.1" fill="#7dd3fc"/>

  <!-- Ears -->
  <rect x="9" y="28" width="4.5" height="11" rx="2.2" fill="#e6e9f4"/>
  <rect x="50.5" y="28" width="4.5" height="11" rx="2.2" fill="#e6e9f4"/>

  <!-- Chest indicator, tying the mark to the running state in the app -->
  <rect x="24" y="51" width="16" height="6" rx="3" fill="#e6e9f4"/>
  <circle cx="32" cy="54" r="2.4" fill="#e8873a"/>
</svg>
