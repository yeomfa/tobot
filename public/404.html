<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Tobot</title>
    <!--
      GitHub Pages has no server-side routing: a request for /entrar finds no
      file and lands here. This hands the path to index.html as a query string,
      which the app reads back before React starts, so the address bar keeps
      clean paths instead of carrying a `#` around.

      Nothing is rendered in between, so a visitor never sees this page.
    -->
    <script>
      (function () {
        var path = window.location.pathname;
        var base = '__BASE_PATH__';
        // Everything after the base is the route the visitor asked for.
        var route = path.indexOf(base) === 0 ? path.slice(base.length) : path.replace(/^\//, '');
        window.location.replace(
          base + '?redirect=/' + route + window.location.search.replace(/^\?/, '&') + window.location.hash,
        );
      })();
    </script>
  </head>
  <body></body>
</html>
